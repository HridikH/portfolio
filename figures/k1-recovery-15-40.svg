<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Recovery rate at 15-40 N·s by checkpoint</title><desc id="d">Baseline 61 percent, stage0 84, stage1 87, stage2 70, stage3 54 percent. Only stage3 is below baseline.</desc><rect width="720" height="250" fill="#ffffff"/><text x="10.0" y="22.0" font-size="13" fill="#1d1d1f" text-anchor="start" font-weight="600">Recovered from one 15–40 N·s push (simulation, 256 trials each; stage0 and stage1 never trained at this level)</text><text x="180.0" y="57.0" font-size="11.5" fill="#1d1d1f" text-anchor="end" font-weight="400">Baseline (no push training)</text><rect x="190" y="40" width="280.6" height="26" rx="3" fill="#6e6e73"/><text x="478.6" y="57.0" font-size="12" fill="#1d1d1f" text-anchor="start" font-weight="600">61%</text><text x="180.0" y="93.0" font-size="11.5" fill="#1d1d1f" text-anchor="end" font-weight="400">stage0  (trained up to 5-20)</text><rect x="190" y="76" width="386.4" height="26" rx="3" fill="#9bbfe6"/><text x="584.4" y="93.0" font-size="12" fill="#1d1d1f" text-anchor="start" font-weight="600">84%</text><text x="180.0" y="129.0" font-size="11.5" fill="#1d1d1f" text-anchor="end" font-weight="400">stage1  (trained up to 10-30)</text><rect x="190" y="112" width="400.2" height="26" rx="3" fill="#0071e3"/><text x="598.2" y="129.0" font-size="12" fill="#1d1d1f" text-anchor="start" font-weight="600">87%</text><text x="180.0" y="165.0" font-size="11.5" fill="#1d1d1f" text-anchor="end" font-weight="400">stage2  (trained up to 15-40)</text><rect x="190" y="148" width="322.0" height="26" rx="3" fill="#9bbfe6"/><text x="520.0" y="165.0" font-size="12" fill="#1d1d1f" text-anchor="start" font-weight="600">70%</text><text x="180.0" y="201.0" font-size="11.5" fill="#1d1d1f" text-anchor="end" font-weight="400">stage3  (trained up to 20-50)</text><rect x="190" y="184" width="248.4" height="26" rx="3" fill="#b5701a"/><text x="446.4" y="201.0" font-size="12" fill="#1d1d1f" text-anchor="start" font-weight="600">54%</text><line x1="470.6" y1="34.0" x2="470.6" y2="216.0" stroke="#6e6e73" stroke-width="1.2" stroke-dasharray="4 3"/><text x="470.6" y="232.0" font-size="11" fill="#6e6e73" text-anchor="middle" font-weight="400">baseline 61%</text></svg>
