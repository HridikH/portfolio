<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Simulated fall rate by push strength for each checkpoint</title><desc id="d">Baseline falls 1, 12, 39, 51 percent at 5-20, 10-30, 15-40, 20-50 N·s. stage1 falls 0, 3, 13, 37 percent. stage3 falls 6, 27, 46, 65 percent, worse than baseline at every level.</desc><rect width="720" height="400" fill="#ffffff"/><line x1="56.0" y1="344.0" x2="530.0" y2="344.0" stroke="#e3e3e8" stroke-width="1"/><text x="48.0" y="348.0" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="400">0%</text><line x1="56.0" y1="299.1" x2="530.0" y2="299.1" stroke="#e3e3e8" stroke-width="1"/><text x="48.0" y="303.1" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="400">10%</text><line x1="56.0" y1="254.3" x2="530.0" y2="254.3" stroke="#e3e3e8" stroke-width="1"/><text x="48.0" y="258.3" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="400">20%</text><line x1="56.0" y1="209.4" x2="530.0" y2="209.4" stroke="#e3e3e8" stroke-width="1"/><text x="48.0" y="213.4" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="400">30%</text><line x1="56.0" y1="164.6" x2="530.0" y2="164.6" stroke="#e3e3e8" stroke-width="1"/><text x="48.0" y="168.6" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="400">40%</text><line x1="56.0" y1="119.7" x2="530.0" y2="119.7" stroke="#e3e3e8" stroke-width="1"/><text x="48.0" y="123.7" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="400">50%</text><line x1="56.0" y1="74.9" x2="530.0" y2="74.9" stroke="#e3e3e8" stroke-width="1"/><text x="48.0" y="78.9" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="400">60%</text><line x1="56.0" y1="30.0" x2="530.0" y2="30.0" stroke="#e3e3e8" stroke-width="1"/><text x="48.0" y="34.0" font-size="11" fill="#6e6e73" text-anchor="end" font-weight="400">70%</