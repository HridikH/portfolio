        <h1 style="letter-spacing: -0.03em;">Hridik Hingorani</h1>
        <p>Robotics &middot; reinforcement learning &middot; control systems. Computer Engineering at UIUC, Mathematics minor, May 2027. The interactive version of this site needs JavaScript; the projects are listed below, and the <a href="/k1.html" style="color: #0071e3;">K1 case study</a> and <a href="/projects.html" style="color: #0071e3;">engineering notes</a> work without it.</p>
        <p style="font-size: 0.9rem; color: #6e6e73;">Completed work first. In-progress and planned items are labeled.</p>
        <ul style="line-height: 1.7;">
          <li><strong><a href="/k1.html" style="color: #0071e3;">Humanoid Push Recovery, Booster K1</a></strong> &middot; PPO push recovery for the 19.7 kg K1, trained in mjlab on 4,096 parallel environments on NCSA Delta A100, A40 and GH200 GPUs (~400,000 steps/s on GH200); simulated recovery from one unseen 15 to 40 N&middot;s push raised from 61% to 87%; on hardware, zero falls across about 18 hand pushes (peak tilt 32&deg;) &middot; <a href="https://github.com/HridikH/k1-push-recovery" style="color: #0071e3;">code</a></li>
          <li><strong><a href="/projects.html#crs" style="color: #0071e3;">Real-Time Task-Space Impedance Control, CRS Arm</a></strong> &middot; 1 kHz task-space impedance controller in C on a TMS320F28335 DSP, joint torque commands to a 3-joint arm, 5 N&middot;m saturation</li>
          <li><strong><a href="/projects.html#ur3" style="color: #0071e3;">UR3 Vision-Guided Contour Drawing</a></strong> &middot; closed-form 6-DOF inverse kinematics, product-of-exponentials forward kinematics, Canny and contour extraction, 142-stroke drawing in 7 minutes &middot; <a href="https://github.com/HridikH/ur3-image-drawing" style="color: #0071e3;">code</a></li>
          <li><strong>RISC-V Preemptive Multitasking OS Kernel</strong> &middot; roughly 6,000 lines of C, preemptive scheduler, Sv39 three-level paging, VirtIO, FAT, pipes, shell &middot; <em>code available on request</em></li>
          <li><strong><a href="/projects.html#gem" style="color: #0071e3;">Self-Driving Stack, Polaris GEM</a></strong> &middot; <em>in progress</em> &middot; ROS 2 stack on a full-scale EV; Pure Pursuit with a Stanley comparison, speed PID, command limits; lane keeping from the camera on the vehicle</li>
          <li><strong>Flex-Sensor Teleoperated Hand</strong> &middot; <em>in progress</em> &middot; 5-channel flex-sensor board routed in KiCad, ESP-NOW leader-follower link, PCA9685 servo output</li>

          <li><strong><a href="https://github.com/HridikH/JupiterAI" style="color: #0071e3;">Jupiter AI</a></strong> &middot; fully local voice assistant on Apple Silicon; Whisper STT, Qwen3 on MLX, Kokoro TTS, real barge-in</li>
